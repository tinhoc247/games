function mnote(f,t,d,type,v,a,bus,lp){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(a||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lp,t);fl.frequency.exponentialRampToValueAtTime(Math.max(200,lp/4),t+d);o.connect(fl);fl.connect(g)}else o.connect(g);g.connect(bus||mg);o.start(t);o.stop(t+d+.05)}
function mkick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(dm);o.start(t);o.stop(t+.23)}
function mnoise(t,d,v,f,type){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(dm);s.start(t);s.stop(t+d+.02)}
function playBar(t){const bar=mstep++%8,c=MUS_CH[bar],r=c[0],tn=c[1]?[0,3,7]:[0,4,7];
 for(let b=0;b<4;b++)mkick(t+b*2*E);
 [2,6].forEach(i=>mnoise(t+i*E,.14,.4,2000,'bandpass'));
 for(let i=0;i<8;i++)mnoise(t+i*E,i%2?.07:.03,i%2?.18:.09,8000,'highpass');
 if(bar==7)for(let k=1;k<4;k++)mnoise(t+(6+k/2)*E,.08,.28,2500,'bandpass');
 for(let i=0;i<8;i++)mnote(fq(r-12+(i==7?7:i%2?12:0)),t+i*E,E*.8,'sawtooth',.1,.005,mg,900);
 for(let i=1;i<8;i+=2)tn.forEach(x=>mnote(fq(r+x),t+i*E,E*.45,'square',.013,.004));
 MUS_ML[bar].forEach(n=>mnote(fq(n[1]),t+n[0]*E,E*n[2]*.92,'square',.04,.01))}
function startMusic(){if(AC){if(AC.state=='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 MS=AC.createGain();MS.gain.value=musOn?MVOL:0;const cp=AC.createDynamicsCompressor();cp.threshold.value=-20;cp.ratio.value=4;MS.connect(cp);cp.connect(AC.destination);
 mg=AC.createGain();mg.connect(MS);dm=AC.createGain();dm.connect(MS);
 NB=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const dl=AC.createDelay(),fb=AC.createGain(),dg=AC.createGain();dl.delayTime.value=E*1.5;fb.gain.value=.28;dg.gain.value=.45;mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(dg);dg.connect(MS);
 nt=AC.currentTime+.2;setInterval(()=>{if(AC.state=='running')while(nt<AC.currentTime+1.5){playBar(nt);nt+=BAR}else nt=AC.currentTime+.2},400)}
function musLbl(){['mus','musb'].forEach(i=>{const b=document.getElementById(i);if(b)b.textContent=i=='mus'?'🎵 Nhạc: '+(musOn?'Bật':'Tắt'):(musOn?'🎵':'🔇')})}
function toggleMusic(){musOn=!musOn;if(!AC)startMusic();else{if(AC.state=='suspended')AC.resume();MS.gain.value=musOn?MVOL:0}musLbl()}

(function(){var d=document,b=d.createElement('button');b.id='musb';b.type='button';b.title='Bật/tắt nhạc';b.setAttribute('aria-label','Bật/tắt nhạc');
b.style.cssText='position:fixed;left:60px;bottom:8px;z-index:80;width:44px;height:44px;padding:0;margin:0;border:0;border-radius:50%;font-size:22px;line-height:1;background:rgba(15,23,42,.55);color:#fff;box-shadow:none;cursor:pointer;display:grid;place-items:center';
b.onclick=function(ev){ev.stopPropagation();toggleMusic()};d.body.appendChild(b);musLbl();})();
(function(){var d=document,h=function(){['pointerdown','keydown','touchend'].forEach(function(n){d.removeEventListener(n,h,true)});try{startMusic()}catch(e){}};
['pointerdown','keydown','touchend'].forEach(function(n){d.addEventListener(n,h,true)})})();
</script>
<script id="pause-js">
(function(){
var d=document,e=d.documentElement,rq=e.requestFullscreen||e.webkitRequestFullscreen,ov,paused=false,sus=false,miss=0,noFs=false;
var isF=function(){return !!(d.fullscreenElement||d.webkitFullscreenElement)};
function playing(){try{return !!ME&&!!S&&S.status=='running'&&!ENDED}catch(x){return false}}
function mk(){
 ov=d.createElement('div');ov.id='pzo';
 ov.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(15,23,42,.96);color:#fff;text-align:center;padding:24px;font-family:inherit';
 ov.innerHTML='<div style="font-size:76px;line-height:1">⏸️</div><div style="font-size:30px;font-weight:800">Game đang tạm dừng</div><div style="font-size:17px;opacity:.85;max-width:460px;line-height:1.45">Trò chơi cần chạy ở chế độ toàn màn hình. Bấm nút bên dưới để vào toàn màn hình và chơi tiếp nhé!</div><button type="button" id="pzb" style="margin-top:6px;padding:14px 34px;border:0;border-radius:16px;font-size:22px;font-weight:800;background:#f97316;color:#fff;cursor:pointer;box-shadow:0 5px 0 #c2410c">▶ Chơi tiếp</button>';
 d.body.appendChild(ov);
 ov.addEventListener('click',function(ev){ev.stopPropagation();go()});
}
function pause(){
 if(paused||!playing())return;
 if(!ov)mk();
 paused=true;ov.style.display='flex';
 e.classList.add('pz-on');
 try{if(typeof AC!=='undefined'&&AC&&AC.state==='running'){AC.suspend();sus=true}}catch(x){}
 try{d.querySelectorAll('video,audio').forEach(function(m){if(!m.paused){m.pause();m._pz=1}})}catch(x){}
}
function resume(){
 if(!paused)return;
 paused=false;miss=0;if(ov)ov.style.display='none';
 e.classList.remove('pz-on');
 try{if(sus&&typeof AC!=='undefined'&&AC)AC.resume()}catch(x){}sus=false;
 try{d.querySelectorAll('video,audio').forEach(function(m){if(m._pz){m._pz=0;m.play()}})}catch(x){}
}
function go(){
 if(!rq||isF()){resume();return}
 try{var p=rq.call(e,{navigationUI:'hide'});
  if(p&&p.then)p.then(resume,function(){noFs=true;resume()});else resume()
 }catch(x){noFs=true;resume()}
}
var st=d.createElement('style');st.textContent='html.pz-on *{animation-play-state:paused!important}';d.head.appendChild(st);
d.addEventListener('visibilitychange',function(){if(d.hidden)pause()});
window.addEventListener('pagehide',pause);
/* Đang chơi mà không ở toàn màn hình (thu nhỏ / thoát) -> tạm dừng */
function chk(){
 if(!rq||noFs||paused||!playing()){miss=0;return}
 if(isF()){miss=0;return}
 if(++miss>=2)pause()
}
d.addEventListener('fullscreenchange',function(){if(!isF())chk()});
d.addEventListener('webkitfullscreenchange',function(){if(!isF())chk()});
setInterval(chk,700);
['keydown','keyup','keypress'].forEach(function(n){window.addEventListener(n,function(ev){if(paused){ev.stopImmediatePropagation();ev.preventDefault()}},true)});
})();
</script>
</body></html>
