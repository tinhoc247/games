<script>window.MUSIC_THEME = 'tank';</script><script src="../../music-themes.js"></script><script src="../chay-dua/race.js"></script>

<script>
(function () {
  'use strict';
  const TG = p => 'tank/' + p, qs = new URLSearchParams(location.search);
  const CODE = String(qs.get('code') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  const W = 2600, HH = 1700, R = 22, SHOP = 210, COST = 1000, TC = ['#ef4444', '#3b82f6', '#eab308', '#a855f7', '#14b8a6', '#f97316'];
  const app = $('#app'), cv = $('#cv'), c = cv.getContext('2d', { alpha: false });
  const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (_) { return null; } };
  let S = null, PL = {}, RAW = [], VALID = [], OFF = 0, phase = 'join', joinAv = '', solo = false, END = 0, TI = null, lastKey = '', TE = null, seen = new Set(), TER = null, OB = [], MAP = 'mix', joinMap = 'mix', vehKey = '';
  let me = { x: 0, y: 0, b: 0, a: 0, armor: 0, gun: 0, gold: 0, gt: 0, k: 0, d: 0, alive: false, inv: 0, team: -1, name: '', av: '' };
  let RS = 1, perfCool = 0, perfAcc = 0, perfN = 0, perfT = 0, shopKey = '', camInit = 0, lastDt = .016, BOTS = [], TK = {}, BU = [], FX = [], paused = false, nextShot = 0, mouse = { x: 0, y: 0, d: false, r: false }, keys = {}, cw = 0, ch = 0, cx = 0, cy = 0, lastSave = 0, lastHud = 0, last = 0;
  const turn = (a, t, k) => { let d = Math.atan2(Math.sin(t - a), Math.cos(t - a)); return a + d * Math.min(1, k); };
  const now = () => Date.now() + OFF, cl = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a);
  const toast = (t, g) => { const d = document.createElement('div'); if (g) d.className = 'good'; d.textContent = t; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200); };
  $('#bSnd').textContent = Snd.mute ? '🔇' : '🔊'; $('#bSnd').onclick = () => { $('#bSnd').textContent = Snd.toggle() ? '🔇' : '🔊'; };
  const sameTeam = (a, b) => a >= 0 && a === b;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;

  /* ---------- Mạng: mọi yêu cầu có thời hạn chờ + thử lại + đo độ trễ ----------
     Trước đây một yêu cầu bị treo (mạng chậm/chập chờn) làm vòng cập nhật đứng vĩnh viễn: không thấy trận bắt đầu,
     không nhận được đạn/điểm. Giờ mỗi yêu cầu tự huỷ sau thời hạn và vòng sau chạy lại. */
  const NETQ = { rtt: 0, fails: 0 }, DBU = RACE_CFG.databaseURL.replace(/\/$/, '');
  async function tfb(p, m, b, o) {
    o = o || {}; if (!TOK) await fbAuth();
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), o.to || 7000), t0 = performance.now(), M = m || 'GET';
    try {
      const r = await fetch(DBU + '/' + p + '.json?' + (o.q ? o.q + '&' : '') + 'auth=' + TOK, { method: M, headers: b === undefined ? undefined : { 'Content-Type': 'application/json' }, body: b === undefined ? undefined : JSON.stringify(b), signal: ac.signal });
      if (r.status === 401 && !o.again) { clearTimeout(tm); await fbRefresh(); return tfb(p, m, b, Object.assign({}, o, { again: 1 })); }
      if (!r.ok) { let e = ''; try { const j = await r.json(); e = j && j.error || ''; } catch (_) {} throw Error(r.status === 401 || r.status === 403 ? 'Không có quyền truy cập dữ liệu (' + (e || r.status) + '). Cần thêm Rules cho vùng "tank" (xem HUONG-DAN.md).' : 'Database ' + r.status + (e ? ': ' + e : '')); }
      const j = r.status === 204 ? null : await r.json();
      if (M === 'GET') { const dt = performance.now() - t0; NETQ.rtt = NETQ.rtt ? NETQ.rtt * .7 + dt * .3 : dt; }
      NETQ.fails = 0; return j;
    } catch (e) { NETQ.fails++; if (e && e.name === 'AbortError') throw Error('Mạng quá chậm, đang thử lại…'); if (e instanceof TypeError) throw Error('Mất kết nối mạng, đang thử lại…'); throw e; } finally { clearTimeout(tm); }
  }
  /* đọc có thử lại (vào phòng / vào lại): một yêu cầu rớt do mạng chập chờn không làm hỏng cả lần vào */
  async function tget(p, o) { o = o || {}; const n = o.retry == null ? 3 : o.retry; for (let i = 0; ; i++) { try { return await tfb(p, 'GET', undefined, o); } catch (e) { if (i >= n || /quyền|Database [34]/.test(e.message)) throw e; await sleep(300 * (i + 1)); } } }
  /* ghi quan trọng (sự kiện bắn / trúng đạn): thử lại vài lần; trùng lặp được loại bằng mã id ở phía nhận */
  async function tpost(p, m, b, tries) { tries = tries || 4; for (let i = 0; i < tries; i++) { try { return await tfb(p, m, b, { to: 6000 }); } catch (e) { if (/quyền/.test(e.message) || i === tries - 1) throw e; await sleep(350 * (i + 1)); } } }
  /* độ lệch đồng hồ so với máy chủ: lấy mẫu có độ trễ (RTT) thấp nhất cho chính xác */
  let OFFRTT = 1e9;
  async function syncClock(n) {
    for (let i = 0; i < n; i++) {
      try { const t0 = Date.now(), r = await tfb(TG('players/' + CODE + '/' + ME), 'PATCH', { ping: { '.sv': 'timestamp' } }, { to: 6000 }), t1 = Date.now(); if (r && +r.ping > 0 && t1 - t0 < OFFRTT) { OFFRTT = t1 - t0; OFF = +r.ping - (t0 + t1) / 2; } } catch (_) {}
      if (i < n - 1) await sleep(500);
    }
  }

  /* ---------- Cấp giáp & vũ khí (tên + mô tả hiển thị trên xe và bảng "Xe của em") ---------- */
  const ARM = [{ n: 'Thép mỏng', d: 'Chưa có giáp phụ' }, { n: 'Giáp thép', d: '1 lớp giáp phụ' }, { n: 'Giáp composite', d: '2 lớp giáp phụ' }, { n: 'Giáp phản ứng', d: '3 lớp giáp phụ' }];
  const GUN = [{ n: 'Pháo 75mm', d: 'Xuyên 0 lớp giáp' }, { n: 'Pháo 90mm', d: 'Xuyên 1 lớp giáp' }, { n: 'Pháo kép 105mm', d: 'Xuyên 2 lớp giáp' }, { n: 'Pháo tên lửa 120mm', d: 'Xuyên 3 lớp giáp' }];
  const lv = v => Math.max(0, Math.min(3, v | 0));
  /* ---------- Kiểu chiến trường (thầy/cô chọn khi tạo mã; "tự chọn" chỉ dùng cho chế độ offline) ---------- */
  const MAPS = {
    mix: { n: 'Hỗn hợp', ic: '🗺️', d: 'Rừng – đồng bằng – đồi núi' },
    forest: { n: 'Rừng rậm', ic: '🌲', d: 'Nhiều cây, xe chạy chậm hơn' },
    desert: { n: 'Sa mạc', ic: '🏜️', d: 'Cát, xương rồng, đá' },
    snow: { n: 'Tuyết nguyên', ic: '❄️', d: 'Thông phủ tuyết, nền băng trơn' },
    city: { n: 'Thành phố đổ nát', ic: '🏙️', d: 'Nhà cao tầng chắn đạn, đường phố' }
  };
  const MKEYS = Object.keys(MAPS);
  function mapKind() {
    const m = S && S.map;
    if (m === 'random') return MKEYS[Math.abs(+S.seed || 1) % MKEYS.length];
    if (m === 'pick') { const v = solo ? LS('tankMap_' + CODE) : null; return MAPS[v] ? v : 'mix'; }
    return MAPS[m] ? m : 'mix';
  }
  const mapLabel = () => (S && S.map === 'pick' && !solo) ? '' : (MAPS[MAP].ic + ' ' + MAPS[MAP].n);
  const spdAt = x => MAP === 'mix' ? (x / W > .66 ? .8 : x / W < .34 ? .9 : 1) : MAP === 'forest' ? .9 : MAP === 'snow' ? .85 : MAP === 'desert' ? .95 : 1;

  /* ---------- Bản đồ: 4 xưởng ở 4 góc, phần còn lại theo kiểu chiến trường ---------- */
  const shopAt = (x, y) => (x < SHOP || x > W - SHOP) && (y < SHOP || y > HH - SHOP) ? ((x > W / 2 ? 1 : 0) + (y > HH / 2 ? 2 : 0)) : -1;
  const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const okSpot = (x, y, m) => shopAt(x, y) < 0 && shopAt(x + m, y + m) < 0 && shopAt(x - m, y - m) < 0 && shopAt(x + m, y - m) < 0 && shopAt(x - m, y + m) < 0;
  const CW = W / 5, CH = HH / 4, RM = 65;   /* thành phố: lưới 5×4 ô, mỗi ô một toà nhà, đường rộng ~130 */
  function genOB(r) {
    const spot = () => [60 + r() * (W - 120), 60 + r() * (HH - 120)];
    if (MAP === 'mix') {
      for (let i = 0; i < 150; i++) {
        const [x, y] = spot(), z = x / W; if (!okSpot(x, y, 50)) continue;
        if (z < .34) OB.push({ t: 0, x, y, r: 20 + r() * 12 }); else if (z > .66) OB.push({ t: 1, x, y, r: 22 + r() * 26 }); else if (r() < .3) OB.push({ t: 2, x, y, r: 16 + r() * 10 });
      }
    } else if (MAP === 'forest') {
      for (let i = 0; i < 270; i++) { const [x, y] = spot(), q = r(); if (!okSpot(x, y, 50)) continue; OB.push(q < .82 ? { t: 0, x, y, r: 20 + r() * 14 } : { t: 1, x, y, r: 18 + r() * 14 }); }
    } else if (MAP === 'desert') {
      for (let i = 0; i < 150; i++) { const [x, y] = spot(), q = r(); if (!okSpot(x, y, 50)) continue; OB.push(q < .5 ? { t: 3, x, y, r: 12 + r() * 6 } : { t: 1, x, y, r: 20 + r() * 26, sand: 1 }); }
    } else if (MAP === 'snow') {
      for (let i = 0; i < 175; i++) { const [x, y] = spot(), q = r(); if (!okSpot(x, y, 50)) continue; OB.push(q < .62 ? { t: 4, x, y, r: 20 + r() * 12 } : { t: 5, x, y, r: 20 + r() * 24 }); }
    } else {   /* city */
      const cols = ['#7a7f88', '#8a7f76', '#6d7a86', '#80766b', '#767b73'];
      for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) {
        const ix = i * CW + RM, iy = j * CH + RM, iw = CW - 2 * RM, ih = CH - 2 * RM, w = Math.min(iw, 190 + r() * 120), h = Math.min(ih, 120 + r() * 100);
        if (r() < .12) continue;
        const x = ix + r() * (iw - w), y = iy + r() * (ih - h); if (!okSpot(x, y, 30) || !okSpot(x + w, y + h, 30) || !okSpot(x + w, y, 30) || !okSpot(x, y + h, 30) || !okSpot(x + w / 2, y + h / 2, 30)) continue;
        OB.push({ t: 'b', x, y, w, h, c: cols[r() * cols.length | 0], k: r() });
      }
      for (let i = 0; i < 60; i++) { const [x, y] = spot(), rr2 = 13 + r() * 8; if (okSpot(x, y, 50) && !blocked(x, y, rr2 + 46)) OB.push({ t: 1, x, y, r: rr2 }); }
    }
  }
  function paintGround(g, rr) {
    const lin = (stops) => { const gr = g.createLinearGradient(0, 0, W, 0); stops.forEach(s2 => gr.addColorStop(s2[0], s2[1])); g.fillStyle = gr; g.fillRect(0, 0, W, HH); };
    const dots = (n, cols, w0, h0) => { for (let i = 0; i < n; i++) { g.fillStyle = cols[rr() * cols.length | 0]; g.fillRect(rr() * W, rr() * HH, w0 + rr() * 5, h0 + rr() * 3); } };
    if (MAP === 'mix') {
      lin([[0, '#2f6b34'], [.3, '#3f7f3a'], [.4, '#86c45f'], [.6, '#8fcb63'], [.7, '#a8a07c'], [1, '#8d8467']]);
      for (let i = 0; i < 3500; i++) { const x = rr() * W; g.fillStyle = x / W > .66 ? (rr() < .5 ? '#7b7358' : '#b4ab8a') : (rr() < .5 ? '#ffffff14' : '#00000014'); g.fillRect(x, rr() * HH, 3 + rr() * 5, 2 + rr() * 3); }
      for (let i = 0; i < 160; i++) { const x = W * .34 + rr() * W * .32; g.fillStyle = ['#fde68a', '#fbcfe8', '#fff'][i % 3]; g.beginPath(); g.arc(x, rr() * HH, 3, 0, 7); g.fill(); }
    } else if (MAP === 'forest') {
      lin([[0, '#1d4a27'], [1, '#2c6a35']]); dots(3500, ['#ffffff12', '#00000022', '#14532d55'], 3, 2);
      for (let i = 0; i < 26; i++) { g.fillStyle = '#5a463055'; g.beginPath(); g.ellipse(rr() * W, rr() * HH, 40 + rr() * 60, 20 + rr() * 30, rr() * 3, 0, 7); g.fill(); }
    } else if (MAP === 'desert') {
      lin([[0, '#e0bc78'], [1, '#d4a95f']]); dots(4500, ['#c99a5288', '#f1d79a99'], 2, 2);
      for (let i = 0; i < 45; i++) { const x = rr() * W, y = rr() * HH, w = 120 + rr() * 200; g.strokeStyle = i % 2 ? '#f3dca6aa' : '#b9873f66'; g.lineWidth = 6; g.beginPath(); g.arc(x, y, w, 3.4, 5.9); g.stroke(); }
    } else if (MAP === 'snow') {
      lin([[0, '#eef5fb'], [1, '#d6e5f1']]); dots(3500, ['#ffffffcc', '#b7cadb88'], 3, 2);
      for (let i = 0; i < 8; i++) { const x = rr() * W, y = rr() * HH, a = 70 + rr() * 110, b2 = 40 + rr() * 60; g.fillStyle = '#b9def2'; g.beginPath(); g.ellipse(x, y, a, b2, rr(), 0, 7); g.fill(); g.strokeStyle = '#f3fbff'; g.lineWidth = 6; g.stroke(); g.strokeStyle = '#ffffff99'; g.lineWidth = 2; g.beginPath(); g.ellipse(x - 6, y - 4, a * .6, b2 * .5, 0, 0, 7); g.stroke(); }
      for (let i = 0; i < 40; i++) { g.fillStyle = '#ffffff88'; g.beginPath(); g.ellipse(rr() * W, rr() * HH, 40 + rr() * 80, 12 + rr() * 22, rr() * 3, 0, 7); g.fill(); }
    } else {
      g.fillStyle = '#353a42'; g.fillRect(0, 0, W, HH); dots(2500, ['#ffffff0a', '#00000026'], 3, 2);
      for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) { g.fillStyle = '#656b76'; g.fillRect(i * CW + 50, j * CH + 50, CW - 100, CH - 100); g.fillStyle = '#ffffff10'; g.fillRect(i * CW + 50, j * CH + 50, CW - 100, 4); }
      g.strokeStyle = '#fde68acc'; g.lineWidth = 4; g.setLineDash([26, 20]);
      for (let i = 1; i < 5; i++) { g.beginPath(); g.moveTo(i * CW, 0); g.lineTo(i * CW, HH); g.stroke(); }
      for (let j = 1; j < 4; j++) { g.beginPath(); g.moveTo(0, j * CH); g.lineTo(W, j * CH); g.stroke(); } g.setLineDash([]);
    }
  }
  function drawOb(g, o) {
    if (o.w) {   /* nhà */
      g.fillStyle = '#0005'; g.fillRect(o.x + 10, o.y + 12, o.w, o.h); g.fillStyle = o.c; g.fillRect(o.x, o.y, o.w, o.h); g.fillStyle = '#ffffff1c'; g.fillRect(o.x + 8, o.y + 8, o.w - 16, o.h - 16);
      g.strokeStyle = '#0007'; g.lineWidth = 4; g.strokeRect(o.x + 2, o.y + 2, o.w - 4, o.h - 4);
      g.fillStyle = '#0004'; for (let k = 0; k < 3; k++) g.fillRect(o.x + 18 + k * 46, o.y + 18, 30, 22);
      g.fillStyle = '#00000038'; g.beginPath(); g.moveTo(o.x + o.w, o.y); g.lineTo(o.x + o.w - 40 - o.k * 30, o.y); g.lineTo(o.x + o.w, o.y + 36 + o.k * 30); g.fill();
      return;

  const reqFs = () => { try { const p = (docE.requestFullscreen || docE.webkitRequestFullscreen || (() => {})).call(docE, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (_) {} };
  let wasFs = false; document.addEventListener('pointerdown', () => { if (!fsOn()) reqFs(); }, true);
  const onFs = () => { if (fsOn()) wasFs = true; else if (wasFs && phase === 'play') { paused = true; $('#ovZ').style.display = 'flex'; } };
  document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);
  $('#bZ').onclick = () => { paused = false; $('#ovZ').style.display = 'none'; last = performance.now(); reqFs(); };

  /* ---------- Bắn, trúng đạn ---------- */
  const SP = 680, LIFE = 1.05, LAGW = 400;
  function mkBullet(o, tm, x, y, a, L, adv) { BU.push({ o, tm, L, x: x + Math.cos(a) * SP * adv, y: y + Math.sin(a) * SP * adv, vx: Math.cos(a) * SP, vy: Math.sin(a) * SP, life: LIFE - adv }); }
  let fireN = 0;
  function fire(t, mine) {

    /* id: mã duy nhất của phát bắn (máy nhận loại trùng khi mạng chậm buộc phải gửi lại); tf: giờ máy chủ lúc bắn (ts chỉ là lúc sự kiện tới nơi) */
    if (mine && !solo) tpost(TG('events/' + CODE), 'POST', { t: 'f', f: ME, id: ME.slice(-5) + Date.now().toString(36) + (++fireN), x: Math.round(bx), y: Math.round(by), a: +t.a.toFixed(3), L: t.gun, tm: t.team, tf: Math.round(now()), ts: { '.sv': 'timestamp' } }).catch(() => {});
  }

  /* ---------- Đạn của người khác bắn trúng MÌNH? (máy bị bắn là nơi tính sát thương) ----------
     Lỗi cũ: sự kiện bắn tới trễ (hỏi 0,7 s + độ trễ mạng) rồi đạn bị "dịch thẳng" ra xa vị trí lẽ ra nó phải bay qua → đạn nhảy cóc qua xe,
     người bắn thấy trúng nhưng máy bị bắn không ghi nhận (và mạng càng chậm càng hay xảy ra). Cách mới: khi nhận sự kiện, bay lại đạn từng bước
     từ lúc bắn tới giờ và đối chiếu với LỊCH SỬ VỊ TRÍ của mình (HIST); thêm cửa sổ LAGW để bù độ trễ hiển thị của người bắn. */
  const HIST = [], FID = new Set();
  function checkHit(bx, by, T) {
    if (!me.alive || shopAt(me.x, me.y) >= 0) return false;
    for (let i = HIST.length - 1; i >= 0; i--) { const s = HIST[i]; if (s.t < T - LAGW) break; if (s.t > T + 60) continue; if (s.ok && Math.hypot(bx - s.x, by - s.y) < R + 4) return true; }
    return false;
  }
  function remoteFire(e, key) {
    const id = e.id || key; if (FID.has(id)) return; FID.add(id); if (FID.size > 600) FID.delete(FID.values().next().value);
    const tf = e.tf > 0 && Math.abs((e.ts || e.tf) - e.tf) < 8000 ? e.tf : (e.ts || now()), age = cl((now() - tf) / 1000, 0, LIFE);
    const bl = { o: e.f, tm: e.tm, L: e.L, id, x: e.x, y: e.y, vx: Math.cos(e.a) * SP, vy: Math.sin(e.a) * SP, life: LIFE }, mineOk = !sameTeam(e.tm, me.team), n = Math.floor(age * 30);
    for (let i = 1; i <= n; i++) {
      const tau = i / 30, bx = e.x + bl.vx * tau, by = e.y + bl.vy * tau;
      if (blocked(bx, by, 2)) return;                                   /* đạn đã tắt vào vật cản */
      if (mineOk && checkHit(bx, by, tf + tau * 1000)) { hitMe(bl); return; }
    }
    bl.x = e.x + bl.vx * age; bl.y = e.y + bl.vy * age; bl.life = LIFE - age; if (bl.life > 0) BU.push(bl);
  }
  const fx = (x, y, tx) => FX.push({ x, y, t: 0, tx });
  /* giáp chịu 1 phát; súng cấp L bỏ qua L lớp giáp: còn giáp hiệu dụng thì mất 1 lớp, hết thì hạ gục */
  function dmg(t, L) { if (t.armor - L > 0) { t.armor--; return 0; } return 1; }
  function hitMe(b) {
    const d = dmg(me, b.L); fx(me.x, me.y); Snd.bad();
    if (!solo) tpost(TG('events/' + CODE), 'POST', { t: 'h', f: b.o, to: ME, d, b: b.id || '', ts: { '.sv': 'timestamp' } }).catch(() => {});
    else { const bt = BOTS.find(x => x.id === b.o); if (bt) { bt.g += 100; if (d) bt.k++; } }
    if (d) die(); else toast('🛡️ Giáp đỡ 1 phát! Giáp hạ còn ' + me.armor + ' cấp.'); save();
  }
  function hitBot(t, b) {
    const d = dmg(t, b.L); fx(t.x, t.y); me.gold += 100; me.gt += 100; FX.push({ x: t.x, y: t.y - 30, t: 0, tx: '+100' }); Snd.step();
    if (d) { me.k++; t.alive = false; t.rs = now() + 3500; toast('💥 Em hạ gục ' + t.name + '!', true); } save();
  }
  function die() { me.alive = false; me.d++; me.armor = 0; me.gun = 0; save(); askRespawn(false); }
  /* Bị hạ: trả lời đúng để hồi sinh. Sai thì BẮT BUỘC làm lại đúng câu đó (đáp án xáo lại) cho tới khi đúng. */
  function askRespawn(retry, i) {
    if (phase !== 'play') return; if (i == null) i = VALID[Math.random() * VALID.length | 0]; const q = norm(RAW[i], true) || norm(RAW[VALID[0]], true); q.idx = i;
    showQ(q, ok => { if (phase !== 'play') return close_(); if (ok) { close_(); me.armor = 0; me.gun = 0; spawn(); toast('✅ Hồi sinh ở vị trí ngẫu nhiên! Giáp và súng về ban đầu.', true); } else askRespawn(true, i); },
      `<div class="retry">${retry ? '↩️ Chưa đúng! Em phải trả lời lại đúng câu này mới được hồi sinh.' : '💥 Xe tăng của em bị bắn hạ! Trả lời đúng để hồi sinh.'}</div>`);
  }
  function buy(k) {
    if (shopAt(me.x, me.y) < 0 || !me.alive) return; const cur = k === 'a' ? me.armor : me.gun;
    if (cur >= 3) return toast('Đã nâng tối đa.'); if (me.gold < COST) return toast('Chưa đủ vàng (cần ' + COST + ').');
    me.gold -= COST; if (k === 'a') me.armor++; else me.gun++; Snd.power(); toast(k === 'a' ? '🛡️ Nâng giáp thành công!' : '🔫 Nâng súng thành công!', true); save();
  }
  $('#bA').onclick = () => buy('a'); $('#bG').onclick = () => buy('g');
  /* Ghi hồ sơ lên máy chủ: mỗi lúc chỉ MỘT yêu cầu bay, trong lúc chờ chỉ nhớ trạng thái mới nhất rồi gửi tiếp.
     → mạng chậm không bị dồn hàng chục yêu cầu, không bị ghi đè lỗi thời (yêu cầu cũ tới sau yêu cầu mới).
     Gửi kèm t (giờ máy chủ), vx, vy để máy khác nội suy vị trí đúng thời điểm thay vì đoán theo nhịp hỏi. */
  const SV = { busy: false, dirty: false, sig: '', at: 0, fail: 0 };
  function saveBody() {
    const k = spdAt(me.x), vx = me.alive ? Math.round((me.vx || 0) * k) : 0, vy = me.alive ? Math.round((me.vy || 0) * k) : 0;
    return { x: Math.round(me.x), y: Math.round(me.y), a: +me.a.toFixed(2), b: +me.b.toFixed(2), vx: Math.abs(vx) < 8 ? 0 : vx, vy: Math.abs(vy) < 8 ? 0 : vy, t: Math.round(now()), ar: me.armor, gu: me.gun, g: me.gold, gt: me.gt, k: me.k, d: me.d, al: me.alive ? 1 : 0 };
  }
  function save() { lastSave = performance.now(); if (phase !== 'play' && phase !== 'end') return; SV.dirty = true; pumpSave(); }
  async function pumpSave() {
    if (SV.busy || !SV.dirty) return; SV.busy = true; SV.dirty = false;
    try { await tfb(TG('players/' + CODE + '/' + ME), 'PATCH', saveBody(), { to: 6000 }); SV.fail = 0; } catch (_) { SV.dirty = true; SV.fail++; }
    SV.busy = false; if (SV.dirty) setTimeout(pumpSave, SV.fail ? Math.min(3000, 300 * SV.fail) : 0);
  }
  const saveSig = () => [Math.round(me.x / 2), Math.round(me.y / 2), me.a * 20 | 0, me.b * 8 | 0, (me.vx || 0) / 12 | 0, (me.vy || 0) / 12 | 0, me.armor, me.gun, me.gold, me.k, me.d, me.alive ? 1 : 0].join();

  /* ---------- Vòng cập nhật máy chủ ---------- */
  let ticking = false, tickingE = false, miss = 0, lastS = 0, curPoll = 700;
  async function tick() {
    if (ticking) return; ticking = true;
    try {
      /* chế độ 1 người chỉ cần hồ sơ của chính mình (không tải cả danh sách lớp mỗi 4 giây) */
      const needS = solo || phase !== 'play' || performance.now() - lastS > 2500;   /* đang chơi: trạng thái phòng (kết thúc sớm) chỉ cần hỏi ~2,5 s/lần */
      const [s, p] = await Promise.all([needS ? tfb(TG('sessions/' + CODE)) : S, solo ? tfb(TG('players/' + CODE + '/' + ME)).then(v => v ? { [ME]: v } : null) : tfb(TG('players/' + CODE))]);
      if (!s) { ticking = false; return gone('Phòng đã bị xoá.'); }
      if (needS) lastS = performance.now();
      S = s; PL = p || {};
      if (!PL[ME]) { if (++miss >= 2) { ticking = false; return gone('Em đã bị thầy/cô mời ra khỏi phòng.'); } } else miss = 0;
      readPlayers();
      if (S.status === 'ended' && phase !== 'end') finish(); else if (!solo && (phase === 'wait' || phase === 'join')) route();
      /* Tải danh sách người chơi tăng theo bình phương số người (mỗi máy tải cả lớp): lớp càng đông, giãn nhịp hỏi ra (700 ms ≤ ~17 người → ~1,1 s ở 50 người).
         Vị trí vẫn mượt vì có vận tốc + nội suy; sát thương không phụ thuộc nhịp này. */
      if (!solo && phase === 'play') { const want = cl(500 + Object.keys(PL).length * 12, 700, 1300) + (NETQ.rtt > 500 ? 250 : 0); if (Math.abs(want - curPoll) > 100) { curPoll = want; clearInterval(TI); TI = setInterval(tick, want); } }
    } catch (_) {}
    ticking = false;
  }
  /* Sự kiện bắn / trúng đạn: hỏi riêng, nhanh hơn (0,35 s) vì mỗi lần chỉ tải về vài trăm byte */
  async function tickE() {
    if (tickingE || (phase !== 'play' && phase !== 'count')) return; tickingE = true;
    try { const ev = await fbEv(lastKey); Object.keys(ev).sort().forEach(k => { if (seen.has(k)) return; seen.add(k); lastKey = k; onEv(ev[k], k); }); } catch (_) {}
    tickingE = false;
  }
  /* Vị trí người khác: mỗi mẫu có giờ máy chủ (t) + vận tốc → đoán vị trí HIỆN TẠI = mẫu + vận tốc × tuổi mẫu (không phụ thuộc nhịp hỏi) */
  function readPlayers() {
    const pn = performance.now();
    Object.keys(PL).forEach(id => {
      if (id === ME || !PL[id] || !PL[id].name) return; const r = PL[id], nx = +r.x || 0, ny = +r.y || 0, st = +r.t || 0;
      const t = TK[id] = TK[id] || { id, x: nx, y: ny, b: +r.b || 0, a: +r.a || 0, st: 0, sx: nx, sy: ny, svx: 0, svy: 0, lr: pn, init: 0, alive: false };

      if (fresh) { t.st = st || now(); t.sx = nx; t.sy = ny; t.svx = +r.vx || 0; t.svy = +r.vy || 0; t.lr = pn; }
      const al = !!r.al;
      if (!t.init || (al && !t.alive) || Math.hypot(t.sx - t.x, t.sy - t.y) > 450) { t.x = t.sx; t.y = t.sy; t.init = 1; }
      Object.assign(t, { name: r.name, av: r.av, team: r.team == null ? -1 : r.team, armor: r.ar | 0, gun: r.gu | 0, alive: al, ta: +r.a || 0, tb: +r.b || 0 });
    });
    Object.keys(TK).forEach(id => { if (!PL[id]) delete TK[id]; });
  }
  function predict(k, far) {
    const since = (performance.now() - k.lr) / 1000, age = cl((now() - k.st) / 1000, since, since + .8);   /* tuổi mẫu: không nhỏ hơn thời gian đã nhận, không quá +0,8 s vì lệch đồng hồ */
    let x = k.sx, y = k.sy;
    if (k.alive && (k.svx || k.svy) && far) { const ag = Math.min(1.2, age); x += k.svx * ag; y += k.svy * ag; }
    else if (k.alive && (k.svx || k.svy)) { const ag = Math.min(1.2, age), n = Math.max(1, Math.ceil(ag / .1)), dx = k.svx * ag / n, dy = k.svy * ag / n; for (let i = 0; i < n; i++) { if (!blocked(x + dx, y, R)) x += dx; if (!blocked(x, y + dy, R)) y += dy; } }
    return [x, y];
  }
  const credited = new Set();
  function onEv(e, key) {
    if (!e) return;

    else if (e.t === 'h') {
      if (e.to !== ME) { const v = TK[e.to]; if (v) fx(v.x, v.y); }
      if (e.f === ME) {   /* điểm cho người bắn: mỗi phát chỉ tính một lần dù sự kiện bị gửi trùng */
        const cid = e.b || key; if (credited.has(cid)) return; credited.add(cid);
        const v = e.to === ME ? me : TK[e.to];
        me.gold += 100; me.gt += 100; if (e.d) { me.k++; toast('💥 Em hạ gục ' + ((PL[e.to] || {}).name || 'đối thủ') + '!', true); } FX.push({ x: v ? v.x : me.x, y: (v ? v.y : me.y) - 30, t: 0, tx: '+100' }); Snd.step(); save();
      }
    }
  }
  function gone(m) { clearInterval(TI); clearInterval(TE); LS('tankGame', null); phase = 'end'; cv.style.display = 'none'; app.style.display = ''; close_(); app.innerHTML = `<div class="entry"><main class="ecard"><div class="ebadge">🚧</div><h2>${esc(m)}</h2><button class="ego" onclick="location.href='../../index.html'">Về trang nhập mã</button></main></div>`; }

  /* ---------- Cập nhật mỗi khung hình ---------- */
  function update(dt) {
    const t = now(); if (t >= END || (S && S.status === 'ended')) return finish();
    if (me.alive) {
      let dx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), dy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0), spd = 1;
      const j = TCH.joy;
      if (j) { const jx = (j.x - j.ox) / 60, jy = (j.y - j.oy) / 60, jm = Math.hypot(jx, jy); if (jm > .2) { dx = jx; dy = jy; spd = Math.min(1, jm); } }   /* cần lái cảm ứng (analog) */
      else if (mouse.r && !dx && !dy) { const ddx = mouse.x - (me.x - cx), ddy = mouse.y - (me.y - cy); if (Math.hypot(ddx, ddy) > 36) { dx = ddx; dy = ddy; } }   /* chuột phải: đi tới con trỏ */
      const l = Math.hypot(dx, dy) || 1, k = 1 - Math.exp(-dt * (dx || dy ? 9 : 12));   /* tăng/giảm tốc mượt, không đổi hướng đột ngột */
      me.vx = (me.vx || 0) + (dx / l * 190 * spd - (me.vx || 0)) * k; me.vy = (me.vy || 0) + (dy / l * 190 * spd - (me.vy || 0)) * k;

    }
    const inShop = me.alive && shopAt(me.x, me.y) >= 0, sk = inShop ? lv(me.armor) + ',' + lv(me.gun) : '';
    if (sk !== shopKey) { shopKey = sk; $('#shop').style.display = inShop ? 'flex' : 'none';
    if (inShop) { const A = lv(me.armor), G = lv(me.gun); $('#bA').innerHTML = A >= 3 ? `🛡️ ${ARM[3].n} (3/3)<small>Đã tối đa</small>` : `🛡️ Nâng giáp [1] (${A}/3)<small>${COST} vàng · lên ${ARM[A + 1].n}</small>`; $('#bG').innerHTML = G >= 3 ? `🔫 ${GUN[3].n} (3/3)<small>Đã tối đa</small>` : `🔫 Nâng súng [2] (${G}/3)<small>${COST} vàng · lên ${GUN[G + 1].n} (xuyên ${G + 1} giáp)</small>`; } }
    const all = solo ? BOTS : Object.values(TK);
    for (const k of Object.values(TK)) {
      const far = k.x < cx - 350 || k.x > cx + cw + 350 || k.y < cy - 350 || k.y > cy + ch + 350, [px, py] = predict(k, far), f = 1 - Math.exp(-dt * 10); k.x += (px - k.x) * f; k.y += (py - k.y) * f; k.a = turn(k.a, k.ta, dt * 14); k.b = turn(k.b, k.tb, dt * 14);
    }
    /* lịch sử vị trí của mình (3 s) để đối chiếu đạn tới trễ — xem checkHit */
    if (!HIST.length || t - HIST[HIST.length - 1].t >= 30) { HIST.push({ t, x: me.x, y: me.y, ok: me.alive && shopAt(me.x, me.y) < 0 && t > me.inv }); while (HIST.length && HIST[0].t < t - 3000) HIST.shift(); }
    BOTS.forEach(b => botAI(b, dt, t));
    for (let i = BU.length - 1; i >= 0; i--) {
      const b = BU[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; let dead = b.life <= 0 || blocked(b.x, b.y, 2);
      if (dead && b.life > 0) fx(b.x, b.y);
      if (!dead && b.o !== ME && !sameTeam(b.tm, me.team) && !paused && checkHit(b.x, b.y, t)) { hitMe(b); dead = true; }
      if (!dead && b.o === ME) for (const k of all) if (k.alive && !sameTeam(k.team, me.team) && shopAt(k.x, k.y) < 0 && Math.hypot(b.x - k.x, b.y - k.y) < R + 3) { if (k.bot) hitBot(k, b); else fx(k.x, k.y); dead = true; break; }
      if (dead) BU.splice(i, 1);
    }
    FX.forEach(f => f.t += dt); FX = FX.filter(f => f.t < 1);
    const pn = performance.now();
    if (pn - lastSave > (solo ? 3000 : 300)) { if (solo) save(); else { lastSave = pn; const sg = saveSig(); if (sg !== SV.sig || pn - SV.at > 4000) { SV.sig = sg; SV.at = pn; save(); } } }   /* đứng yên thì không ghi liên tục (nhịp tim 4 s) */
    if (performance.now() - lastHud > 250) { lastHud = performance.now(); hud(); vehCard(); }
  }
  function botAI(b, dt, t) {
    if (!b.alive) { if (t > b.rs) { [b.x, b.y] = spawnPos(); b.alive = true; b.armor = Math.random() < .4 ? 1 : 0; } return; }
    const dx = me.x - b.x, dy = me.y - b.y, dist = Math.hypot(dx, dy), see = me.alive && dist < 620 && shopAt(me.x, me.y) < 0;
    let tx, ty; if (see) { tx = me.x; ty = me.y; } else { if (!b.wp || t > b.wt || Math.hypot(b.wp[0] - b.x, b.wp[1] - b.y) < 40) { b.wp = spawnPos(); b.wt = t + 4000; } [tx, ty] = b.wp; }

  }

  /* ---------- Vẽ ---------- */
  /* Xe nhìn từ trên xuống. Cấp giáp: 1 = giáp hông, 2 = + giáp mũi & khối giáp phản ứng, 3 = + viền vàng & vòng giáp tháp pháo.
     Cấp súng: 0 = nòng đơn, 1 = nòng to + hãm lửa, 2 = nòng kép, 3 = nòng kép nặng + bệ tên lửa. Các vòng xanh quanh xe = số lớp giáp còn lại. */
  const shade = (hex, k) => { const n = parseInt(String(hex).slice(1), 16), f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; };
  /* Chia xe thành 3 phần (vòng giáp + thân, tháp pháo, ảnh đại diện) để vẽ một lần vào sprite rồi dán lại mỗi khung hình.
     body() vẫn dùng cho bảng "Xe của em"; tankFast() dùng sprite cho trận đấu. */
  function ringsPart(g, A) {
    for (let i = 0; i < A; i++) { g.strokeStyle = '#67e8f9'; g.lineWidth = 3; g.globalAlpha = .85; g.beginPath(); g.arc(0, 0, R + 5 + i * 5, 0, 7); g.stroke(); } g.globalAlpha = 1;
  }
  function hullPart(g, A, col) {
    g.fillStyle = '#1c1f1a'; g.fillRect(-26, -23, 52, 9); g.fillRect(-26, 14, 52, 9); g.fillStyle = '#4a5043'; for (let x = -24; x < 25; x += 5) { g.fillRect(x, -23, 2, 9); g.fillRect(x, 14, 2, 9); }
    g.fillStyle = col; g.fillRect(-22, -14, 44, 28); g.fillStyle = '#0003'; g.fillRect(-22, 6, 44, 8); g.fillStyle = '#ffffff24'; g.fillRect(-22, -14, 44, 4);
    g.fillStyle = '#0006'; for (let k = 0; k < 4; k++) g.fillRect(-21, -9 + k * 5, 9, 3);   /* lưới tản nhiệt phía sau */
    g.fillStyle = shade(col, -.3); g.beginPath(); g.moveTo(22, -14); g.lineTo(27, -9); g.lineTo(27, 9); g.lineTo(22, 14); g.closePath(); g.fill();
    if (A >= 1) { g.fillStyle = '#94a3b8'; g.fillRect(-24, -26, 48, 4); g.fillRect(-24, 22, 48, 4); g.fillStyle = '#475569'; for (let x = -20; x <= 20; x += 10) { g.fillRect(x, -25, 2, 2); g.fillRect(x, 23, 2, 2); } }
    if (A >= 2) { g.fillStyle = '#cbd5e1'; g.beginPath(); g.moveTo(21, -14); g.lineTo(30, -9); g.lineTo(30, 9); g.lineTo(21, 14); g.closePath(); g.fill(); g.fillStyle = '#64748b'; for (let x = -14; x <= 14; x += 7) { g.fillRect(x, -12, 5, 4); g.fillRect(x, 8, 5, 4); } }
    if (A >= 3) { g.strokeStyle = '#fbbf24'; g.lineWidth = 2; g.strokeRect(-23, -15, 46, 30); g.fillStyle = '#e2e8f0'; g.fillRect(-24, -28, 48, 3); g.fillRect(-24, 25, 48, 3); }
  }
  function turretPart(g, A, G, col) {
    if (G >= 3) { g.fillStyle = '#7f1d1d'; g.fillRect(-6, -19, 16, 6); g.fillRect(-6, 13, 16, 6); g.fillStyle = '#fde047'; g.fillRect(8, -18, 3, 4); g.fillRect(8, 14, 3, 4); }
    const bc = ['#4b5563', '#d97706', '#f97316', '#ef4444'][G];
    g.fillStyle = bc;
    if (G === 0) g.fillRect(4, -2.5, 32, 5);
    else if (G === 1) { g.fillRect(4, -3.2, 34, 6.4); g.fillStyle = '#92400e'; g.fillRect(34, -5, 5, 10); }
    else { g.fillRect(4, -5.5, G === 2 ? 36 : 38, 3.8); g.fillRect(4, 1.7, G === 2 ? 36 : 38, 3.8); g.fillStyle = G === 2 ? '#9a3412' : '#450a0a'; const e = G === 2 ? 36 : 38; g.fillRect(e - 3, -7, 5, 6.6); g.fillRect(e - 3, 0.4, 5, 6.6); if (G === 3) { g.fillStyle = '#fde047'; g.shadowColor = '#f97316'; g.shadowBlur = 8; g.fillRect(e + 2, -5, 2, 3); g.fillRect(e + 2, 2, 2, 3); g.shadowBlur = 0; } }
    g.fillStyle = shade(col, -.2); g.beginPath(); g.arc(0, 0, 15.5, 0, 7); g.fill();
    if (A >= 2) { g.strokeStyle = A >= 3 ? '#fbbf24' : '#cbd5e1'; g.lineWidth = A >= 3 ? 3 : 2; g.beginPath(); g.arc(0, 0, 15.5, 0, 7); g.stroke(); }
    g.fillStyle = '#e5e7eb'; g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill();   }
  function body(g, t, col) {
    const A = lv(t.armor), G = lv(t.gun);
    ringsPart(g, A);
    g.save(); g.rotate(t.b); hullPart(g, A, col);
    g.rotate(t.a - t.b); turretPart(g, A, G, col);
    g.save(); g.beginPath(); g.arc(0, 0, 11.5, 0, 7); g.clip(); g.rotate(-t.a); const im = avi(t.av); if (im.complete && im.naturalWidth) g.drawImage(im, -12, -12, 24, 24); g.restore();
    g.restore();
  }
  /* ---------- Sprite: vẽ 1 lần, dán nhiều lần (nhanh hơn rất nhiều so với ~60 lệnh vẽ đường/xe/khung hình trên máy yếu) ---------- */
  const SS = 2, SPR = new Map(), LBL = new Map(), AVC = {}, BSP = [], MC = document.createElement('canvas').getContext('2d');
  function mkc(w, h) { const k = document.createElement('canvas'); k.width = w * SS; k.height = h * SS; const g = k.getContext('2d'); g.scale(SS, SS); return [k, g]; }
  function spr(key, w, h, fn) { let k = SPR.get(key); if (!k) { const r = mkc(w, h); r[1].translate(w / 2, h / 2); fn(r[1]); k = r[0]; SPR.set(key, k); } return k; }
  function avSpr(id) { const im = avi(id); if (!(im.complete && im.naturalWidth)) return null; let k = AVC[id]; if (!k) { const r = mkc(24, 24); r[1].beginPath(); r[1].arc(12, 12, 11.5, 0, 7); r[1].clip(); r[1].drawImage(im, 0, 0, 24, 24); k = AVC[id] = r[0]; } return k; }
  function lbl(text, font, fill) {
    const key = font + '|' + fill + '|' + (document.fonts && document.fonts.check && document.fonts.check(font) ? 1 : 0) + '|' + text; let e = LBL.get(key); if (e) return e;
    MC.font = font; const w = Math.ceil(MC.measureText(text).width) + 10, r = mkc(w, 34), g = r[1]; g.font = font; g.textAlign = 'center'; g.lineWidth = 3; g.strokeStyle = '#000b'; g.fillStyle = fill; g.strokeText(text, w / 2, 24); g.fillText(text, w / 2, 24);
    e = { k: r[0], w }; if (LBL.size > 300) LBL.delete(LBL.keys().next().value); LBL.set(key, e); return e;
  }
  function bulletSpr(L) {
    if (!BSP[L]) { const r = 4 + L * .9, bl = 8 + L * 2, sz = Math.ceil((r + bl) * 2 + 4), q = mkc(sz, sz), g = q[1]; g.translate(sz / 2, sz / 2); g.fillStyle = ['#fde047', '#fbbf24', '#fb923c', '#f87171'][L]; g.shadowColor = ['#f59e0b', '#f59e0b', '#ea580c', '#dc2626'][L]; g.shadowBlur = bl * SS; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); BSP[L] = { k: q[0], sz }; }
    return BSP[L];
  }
  function tank(t, col, mine) {
    const A = lv(t.armor), G = lv(t.gun), X = t.x - cx, Y = t.y - cy;
    const hs = spr('h' + col + A, 84, 84, g => { ringsPart(g, A); hullPart(g, A, col); }), ts = spr('t' + col + A + G, 96, 96, g => turretPart(g, A, G, col));
    c.save(); c.translate(X, Y); c.rotate(t.b); c.drawImage(hs, -42, -42, 84, 84); c.rotate(t.a - t.b); c.drawImage(ts, -48, -48, 96, 96); c.restore();
    const av = avSpr(t.av); if (av) c.drawImage(av, X - 12, Y - 12, 24, 24);
    const ny = Y - 36, n = lbl(t.name || '', '800 14px "Be Vietnam Pro",sans-serif', mine ? '#fde047' : '#fff'); c.drawImage(n.k, X - n.w / 2, ny - 24, n.w, 34);
    if (mine || A || G) { const e = lbl('🛡' + A + '  🔫' + G, '800 12px "Be Vietnam Pro",sans-serif', '#a5f3fc'); c.drawImage(e.k, X - e.w / 2, ny - 16 - 24, e.w, 34); }
  }
  /* Bảng "Xe của em": hình xe + tên cấp giáp / vũ khí hiện có */
  function vehCard() {
    const A = lv(me.armor), G = lv(me.gun), key = [A, G, me.team, avi(me.av).complete ? 1 : 0, vehOpen ? 1 : 0].join();
    if (key === vehKey) return; vehKey = key;
    const pips = (n, k) => [0, 1, 2].map(i => `<i class="pip${i < n ? ' on ' + k : ''}"></i>`).join('');
    $('#veh').classList.toggle('c', !vehOpen); $('#veh').title = vehOpen ? 'Bấm để thu gọn' : 'Bấm để xem giáp & vũ khí';
    $('#veh').innerHTML = !vehOpen ? `<canvas id="vc" width="150" height="150"></canvas><div class="vt">🛡️${A} 🔫${G}</div>` : `<canvas id="vc" width="150" height="150"></canvas><div class="vt"><b>⚙️ Xe của em</b>
      <div class="vr">🛡️ <span>${ARM[A].n}</span><small>${pips(A, 'a')} ${ARM[A].d}</small></div>
      <div class="vr">🔫 <span>${GUN[G].n}</span><small>${pips(G, 'g')} ${GUN[G].d}</small></div></div>`;
    const g = $('#vc').getContext('2d'); g.translate(75, 75); g.scale(1.5, 1.5); body(g, { b: -Math.PI / 2, a: -Math.PI / 2, armor: A, gun: G, av: me.av }, me.team >= 0 ? TC[me.team % 6] : '#22c55e');
  }
  const AI = {}; function avi(id) { if (!AI[id]) { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(avH(id).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); AI[id] = i; } return AI[id]; }
  function draw() {
    c.setTransform(RS, 0, 0, RS, 0, 0);
    const gx = cl(me.x - cw / 2, 0, Math.max(0, W - cw)), gy = cl(me.y - ch / 2, 0, Math.max(0, HH - ch)), kc = camInit ? 1 - Math.exp(-lastDt * 12) : 1; camInit = 1;
    cx = Math.round(cx + (gx - cx) * kc); cy = Math.round(cy + (gy - cy) * kc);
    c.fillStyle = '#143014'; c.fillRect(0, 0, cw, ch); c.drawImage(TER, cx, cy, Math.min(cw, W), Math.min(ch, HH), 0, 0, Math.min(cw, W), Math.min(ch, HH));
    const col = t => t.team >= 0 ? TC[t.team % 6] : t === me ? '#22c55e' : '#dc2626';
    (solo ? BOTS : Object.values(TK)).forEach(t => { if (t.alive && t.x > cx - 80 && t.x < cx + cw + 80 && t.y > cy - 80 && t.y < cy + ch + 80) tank(t, col(t), false); });
    if (me.alive) { if (now() < me.inv) c.globalAlpha = .55 + .25 * Math.sin(now() / 80); tank(me, col(me), true); c.globalAlpha = 1; }
    BU.forEach(b => { const x = b.x - cx, y = b.y - cy; if (x < -30 || y < -30 || x > cw + 30 || y > ch + 30) return; const q = bulletSpr(lv(b.L)); c.drawImage(q.k, x - q.sz / 2, y - q.sz / 2, q.sz, q.sz); });
    FX.forEach(f => { if (f.tx) { c.font = '900 22px "Be Vietnam Pro",sans-serif'; c.fillStyle = '#fde047'; c.globalAlpha = 1 - f.t; c.textAlign = 'center'; c.fillText(f.tx, f.x - cx, f.y - cy - f.t * 40); c.globalAlpha = 1; } else { c.fillStyle = `rgba(255,${160 - f.t * 100 | 0},40,${1 - f.t})`; c.beginPath(); c.arc(f.x - cx, f.y - cy, 8 + f.t * 34, 0, 7); c.fill(); } });
    if (!me.alive) { c.fillStyle = '#0006'; c.fillRect(0, 0, cw, ch); }
    const j = TCH.joy; if (j) {   /* cần lái ảo */
      const dx = j.x - j.ox, dy = j.y - j.oy, m = Math.min(1, Math.hypot(dx, dy) / 60), an = Math.atan2(dy, dx);
      c.globalAlpha = .45; c.fillStyle = '#fff'; c.beginPath(); c.arc(j.ox, j.oy, 60, 0, 7); c.fill(); c.globalAlpha = .8; c.fillStyle = '#fde047'; c.beginPath(); c.arc(j.ox + Math.cos(an) * m * 60, j.oy + Math.sin(an) * m * 60, 26, 0, 7); c.fill(); c.globalAlpha = 1;
    }
  }
  /* một khung hình lỗi (vd. dữ liệu lạ của bạn khác) không được làm đứng cả trận: bắt lỗi rồi vẫn chạy khung kế tiếp */
  /* Tự giảm chất lượng: chỉ khi máy thật sự yếu — 60 khung hình liền có thời gian TB > 40 ms (< 25 fps) — thì giảm độ phân giải canvas
     (1 → .85 → .7 → .55) để mượt hơn; mỗi lần giảm đợi ~5 s rồi mới xét tiếp. Máy từ ~25 fps trở lên giữ nguyên độ nét. */
  function perfStep(ms) {
    if (!(ms > 0) || ms > 400) return; perfAcc += ms; perfT += ms * ms; perfN++;
    if (perfN < 60) return; const avg = perfAcc / perfN; perfAcc = perfT = perfN = 0;
    if (perfCool > 0) { perfCool--; return; }
    if (avg > 40 && RS > .56) { RS = +(RS - .15).toFixed(2); perfCool = 2; resize(); }
  }
  function loop(ts) { if (phase !== 'play') return; const dt = Math.min(.05, (ts - last) / 1000 || 0); if (!paused) perfStep(ts - last); last = ts; lastDt = dt; try { if (!paused) update(dt); if (phase === 'play') draw(); } catch (err) { try { console.error(err); (window.__errs = window.__errs || []).push(String(err && err.message)); } catch (_) {} } if (phase === 'play') requestAnimationFrame(loop); }

  /* ---------- HUD & xếp hạng ---------- */
  function board() {
    const L = []; L.push({ name: me.name, av: me.av, g: me.gold, gt: me.gt, k: me.k, me: 1, team: me.team });
    if (solo) BOTS.forEach(b => L.push({ name: b.name, av: b.av, g: b.g, gt: b.g, k: b.k, team: -1 }));
    else Object.entries(PL).forEach(([id, r]) => { if (id !== ME && r && r.name) L.push({ name: r.name, av: r.av, g: r.g | 0, gt: r.gt | 0, k: r.k | 0, team: r.team == null ? -1 : r.team }); });
    return L.sort((a, b) => b.k - a.k || b.g - a.g);
  }
  function hud() {
    const left = Math.max(0, END - now()), m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    const hl = `<span class="pl">💰 ${me.gold}</span><span class="pl">🛡️ ${lv(me.armor)}/3</span><span class="pl">🔫 ${lv(me.gun)}/3</span><span class="pl">${MAPS[MAP].ic} ${MAPS[MAP].n}</span><span class="pl">💥 ${me.k}</span><span class="pl">⏱️ ${m}:${String(s).padStart(2, '0')}</span>${(() => { const rt = Math.round(NETQ.rtt); return rt ? `<span class="pl" style="${rt > 800 ? 'background:#b91c1cdd' : rt > 400 ? 'background:#b45309dd' : ''}">📶 ${rt}ms${rt > 800 ? ' · mạng chậm' : ''}</span>` : ''; })()}`;
    if (hl !== hud.hl) { hud.hl = hl; $('#hl').innerHTML = hl; }
    const bd = board(), rk = bd.findIndex(r => r.me) + 1; $('#hr').classList.toggle('c', !hrOpen); $('#hr').title = hrOpen ? 'Bấm để thu gọn' : 'Bấm để xem bảng xếp hạng';
    const hr = !hrOpen ? `🏆 <b style="display:inline;margin:0">#${rk}</b> · 💥${me.k}` : '<b style="display:block;margin-bottom:4px">🏆 Xếp hạng</b>' + bd.slice(0, 6).map((r, i) => `<div class="${r.me ? 'me' : ''}"><span>${['🥇', '🥈', '🥉'][i] || i + 1}</span>${avOf(r.av)} ${r.team >= 0 ? `<i style="color:${TC[r.team % 6]}">●</i>` : ''}<span>${esc(r.name)}</span><b>💥${r.k} · 💰${r.g}</b></div>`)  .join('');
    if (hr !== hud.hr) { hud.hr = hr; $('#hr').innerHTML = hr; }
  }

  /* ---------- Kết thúc ---------- */
  async function finish() {
    if (phase === 'end') return; phase = 'end'; clearInterval(TI); clearInterval(TE); close_(); Snd.music(false); Snd.win(); paused = false; me.alive = false; save();
    cv.style.display = 'none'; ['hl', 'hr', 'shop', 'veh'].forEach(i => $('#' + i).style.display = 'none'); $('#ovZ').style.display = 'none'; app.style.display = '';
    for (let i = 0; i < 30 && (SV.busy || SV.dirty); i++) await sleep(100);   /* chờ lần ghi cuối của mình tới nơi để bảng xếp hạng đúng */
    if (!solo) { try { PL = (await tfb(TG('players/' + CODE), 'GET', undefined, { to: 8000 })) || PL; } catch (_) {} } if (!solo) PL[ME] = Object.assign({}, PL[ME], { g: me.gold, gt: me.gt, k: me.k });
    const L = board(), rk = L.findIndex(r => r.me) + 1;
    app.innerHTML = `<div class="entry"><main class="ecard wide" style="text-align:left"><div class="ebadge">🏁</div><h2 style="text-align:center">Hết giờ! Em xếp hạng ${rk <= 3 ? ['🥇', '🥈', '🥉'][rk - 1] : '#' + rk}</h2>
      <p class="hint" style="text-align:center">💰 ${me.gold} vàng · 💥 ${me.k} lần hạ đối phương · ☠️ ${me.d} lần bị bắn hạ</p>
      <table class="sumt"><tr><th>#</th><th>Người chơi</th><th>Hạ đối thủ</th><th>Vàng</th></tr>${L.map((r, i) => `<tr class="${r.me ? 'me' : ''}"><td>${i + 1}</td><td>${avOf(r.av)} ${esc(r.name)}</td><td>💥 ${r.k}</td><td>💰 ${r.g}</td></tr>`).join('')}</table>
      <button class="ego" style="margin-top:12px" onclick="location.href='../../index.html'">Về trang nhập mã</button></main></div>`;
  }

  /* ---------- Khởi động (vào lại sau khi tải lại trang) ---------- */
  (async function boot() {
    if (!CODE) return location.replace('../../index.html');
    app.innerHTML = '<div class="entry"><main class="ecard"><div class="ebadge">💥</div><h2>Đang vào phòng…</h2></main></div>';
    try {
      const sv = LS('tankGame');
      if (sv && sv.code === CODE && sv.rt) {
        RT = sv.rt; ME = sv.id; await fbRefresh(); ME = sv.id;
        const [s, m] = await Promise.all([tget(TG('sessions/' + CODE)), tget(TG('players/' + CODE + '/' + ME))]);
        if (s && m && m.name && s.status !== 'ended') { S = s; return await enter(false); }
      }
      await fbAuth(); const [s0, p0] = await Promise.all([tget(TG('sessions/' + CODE)), tget(TG('players/' + CODE))]); S = s0; if (!S) return location.replace('../../index.html?code=' + CODE + '&re=1');
      if (S.status === 'ended') return gone('Trận này đã kết thúc.'); PL = p0 || {}; showEntry();
    } catch (e) { showEntry(e.message); }
  })();
})();
